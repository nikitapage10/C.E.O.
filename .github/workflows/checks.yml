# The Foundry's furnace: typecheck, lint, tests and build on every push to main and nightly.
# When they fail on main, open (or comment on) a Foundry fix issue and wake the Foundry thread.
# See docs/FOUNDRY.md.
name: Checks

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_ROUTINE: ${{ secrets.FOUNDRY_ROUTINE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

      - name: Open a Foundry fix
        id: issue
        if: failure() && github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Checks failing on main";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "foundry,foundry:fix", per_page: 50 });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Still failing: ${run} (commit ${context.sha.slice(0, 7)}).` });
              core.setOutput("number", String(existing.number));
              core.setOutput("fresh", "false");
            } else {
              const { data: created } = await github.rest.issues.create({
                ...context.repo,
                title,
                labels: ["foundry", "foundry:fix"],
                body: `The checks failed on main at commit ${context.sha.slice(0, 7)}.\n\nRun: ${run}\n\nThe Foundry picks this up; see docs/FOUNDRY.md.`,
              });
              core.setOutput("number", String(created.number));
              core.setOutput("fresh", "true");
            }

      - name: Wake the Foundry
        if: failure() && steps.issue.outputs.fresh == 'true' && env.HAS_ROUTINE == 'true'
        env:
          ROUTINE_ID: ${{ secrets.FOUNDRY_ROUTINE_ID }}
          ROUTINE_TOKEN: ${{ secrets.FOUNDRY_ROUTINE_TOKEN }}
          ISSUE: ${{ steps.issue.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(jq -n --arg t "Checks failing on main: issue #$ISSUE, run $RUN_URL" '{text: $t}')
          curl -fsS -X POST "https://api.anthropic.com/v1/claude_code/routines/$ROUTINE_ID/fire" \
            -H "Authorization: Bearer $ROUTINE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$body"
