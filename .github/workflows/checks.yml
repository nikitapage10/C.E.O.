# The Foundry's furnace: typecheck, lint, tests and build on every push to main, every pull request (the
# Foundry's lane branches land through these) and nightly. When they fail on main, open (or comment on) a
# Foundry fix issue; the Foundry thread picks it up at its next queue check (every 15 minutes).
# See docs/DELIVERY.md and docs/FOUNDRY.md. The browser tests run from e2e.yml.
#
# The job name "checks" is the status check a ruleset on main can require (docs/DELIVERY.md, "The ruleset for
# main"): rename it only together with that ruleset. No path filters here, on purpose: a required check that never
# runs leaves a pull request waiting forever.
#
# The boot check (#175) is the last step: it opens the built site in Chromium and fails if the Desk, a Desk tab or the
# Lattice throws or stays blank. The other steps never open the built site, which is how a vendor chunk that threw at
# load went out with every check green (#173).
name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

# Least privilege: jobs only read the code, unless a job says otherwise below.
permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Runs on main are never cancelled, so every commit
# that reaches production gets its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package provenance
        run: npm audit signatures
      - name: Known vulnerabilities (high and above)
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Boot check
        # Loads the dist the build step just made (no second build); about 20 s.
        run: node scripts/boot-check.mjs

  report:
    # The only job that may write: it opens (or comments on) the "Checks failing on main" fix issue.
    needs: checks
    if: failure() && github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      # The crew's own identity (#138): with the App's secrets set, the issue comes from ceo-foundry[bot] on a token
      # that can only write this repo's issues and lapses within the hour. Without them, or if GitHub won't mint one,
      # the built-in token writes it, as before. Only whether they are set is read here, never their values.
      HAS_APP: ${{ secrets.FOUNDRY_APP_ID != '' && secrets.FOUNDRY_APP_PRIVATE_KEY != '' }}
    steps:
      - name: The crew's token
        id: app
        if: env.HAS_APP == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.FOUNDRY_APP_ID }}
          private-key: ${{ secrets.FOUNDRY_APP_PRIVATE_KEY }}
          permission-issues: write
      - name: Open a Foundry fix
        id: issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
          script: |
            const title = "Checks failing on main";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "foundry,foundry:fix", per_page: 50 });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Still failing: ${run} (commit ${context.sha.slice(0, 7)}).` });
              core.setOutput("number", String(existing.number));
              core.setOutput("fresh", "false");
            } else {
              const { data: created } = await github.rest.issues.create({
                ...context.repo,
                title,
                labels: ["foundry", "foundry:fix"],
                body: `The checks failed on main at commit ${context.sha.slice(0, 7)}.\n\nRun: ${run}\n\nThe Foundry picks this up; see docs/FOUNDRY.md.`,
              });
              core.setOutput("number", String(created.number));
              core.setOutput("fresh", "true");
            }
