# Ships main to the Azure copy of C.E.O., beside Vercel (docs/AZURE.md, "Deploys and backups"). Vercel stays
# production and deploys itself; this workflow only keeps the Azure copy in step.
#
# One build, then the site and the functions go out in parallel: the prebuilt apps/world/dist is uploaded to the
# Static Web App (no rebuild there), and azure/dist/functions.zip is zip-deployed to the Flex Consumption app.
#
# Signing in: OIDC only. GitHub hands the job a short-lived token, and Azure trusts it only for this repo's `azure`
# environment, which only main may use. Nothing long-lived is stored in GitHub: the Static Web App's deployment
# token is read at run time and masked. The identity holds Contributor on the C.E.O. resource group and nothing else.
#
# Until Azure is set up (the AZURE_CLIENT_ID variable is empty) every job is skipped, so main stays green.
# Pull requests get no Azure deploy on purpose: that would hand Azure credentials to pull request code. Vercel's
# previews cover them.
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than racing an older one.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  build:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site
        run: npm run build
      - name: Build the functions package
        run: npm run build:azure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: apps/world/dist
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: functions
          path: azure/dist/functions.zip
          retention-days: 3

  site:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: azure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read the deployment token
        id: token
        env:
          RG: ${{ vars.AZURE_RG }}
          SWA: ${{ vars.AZURE_SWA_NAME }}
        run: |
          token=$(az staticwebapp secrets list -g "$RG" -n "$SWA" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Upload the site
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  functions:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: azure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: functions
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the functions
        env:
          RG: ${{ vars.AZURE_RG }}
          APP: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
        run: az functionapp deployment source config-zip -g "$RG" -n "$APP" --src functions.zip
