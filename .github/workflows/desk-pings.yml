# The Desk's pings (#135): when a Foundry issue is opened or its labels change (a new idea, a question from Rivet,
# a blocker the Builder flags), ask the Desk's ping function on Azure (the only home since #313) to look. It decides what needs Nikita's call,
# pings each phone that turned pings on once per item, and keeps quiet from 10pm to 7am Mountain
# (api/_desk/pings.ts). The hourly run catches anything the events missed and sends the 7am summary.
#
# The runs share one queue and each waits a minute first, so a burst (the three morning ideas, a card and its
# question) lands as one ping: a newer run replaces one still waiting. Nothing about an issue is sent; the function
# reads GitHub itself.
#
# GitHub keeps no copy of the pings secret: the job signs in like deploy-azure.yml (OIDC, the `azure` environment,
# main only), reads `desk-pings-secret` from the Key Vault at run time (masked, never printed), and calls the
# Function App. It is skipped until Azure is set up; once it is, a failed sign-in, vault read or call is a red run,
# so silent pings show here (docs/AZURE.md, "Deploys and backups").
name: Desk pings

on:
  issues:
    types: [opened, reopened, labeled, edited]
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: desk-pings
  cancel-in-progress: true

jobs:
  azure:
    if: github.repository == 'nikitapage10/C.E.O.' && vars.AZURE_CLIENT_ID != '' && (github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'foundry'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: azure
    permissions:
      id-token: write
    steps:
      - name: Wait for the burst to settle
        if: github.event_name == 'issues'
        run: sleep 60
      - name: Tidy the Azure settings
        id: az
        env:
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          SUB: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RG: ${{ vars.AZURE_RG }}
          FUNC: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          SWA: ${{ vars.AZURE_SWA_NAME }}
        # A pasted variable can carry a stray line break or space; drop them so sign-in sees clean IDs.
        run: |
          for k in CLIENT TENANT SUB RG FUNC SWA; do
            printf '%s=%s\n' "${k,,}" "$(printf '%s' "${!k}" | tr -d '\r\n[:space:]')" >> "$GITHUB_OUTPUT"
          done
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ steps.az.outputs.client }}
          tenant-id: ${{ steps.az.outputs.tenant }}
          subscription-id: ${{ steps.az.outputs.sub }}
      - name: Ask the Desk to look
        env:
          RG: ${{ steps.az.outputs.rg }}
          FUNC: ${{ steps.az.outputs.func }}
          SWA: ${{ steps.az.outputs.swa }}
          SITE_HOST: ${{ vars.AZURE_SITE_HOST }}
        run: |
          vault=$(az keyvault list -g "$RG" --query "[0].name" -o tsv 2>/dev/null) || vault=""
          secret=""
          if [ -n "$vault" ]; then secret=$(az keyvault secret show --vault-name "$vault" -n desk-pings-secret --query value -o tsv 2>/dev/null) || secret=""; fi
          if [ -z "$secret" ]; then echo "::error::Can't read desk-pings-secret from the Azure Key Vault."; exit 1; fi
          echo "::add-mask::$secret"
          # The Function App's own address first. `az functionapp show` has come back empty for the Flex app (#271), so
          # read the site resource directly, as world-step.yml does.
          host=$(az resource show -g "$RG" -n "$FUNC" --resource-type Microsoft.Web/sites --query properties.defaultHostName -o tsv 2>/dev/null) || host=""
          scan() {
            curl -sS -o scan.json -w '%{http_code}' -X POST --max-time 60 \
              -H "Content-Type: application/json" -H @- --data '{"action":"scan"}' \
              "https://$1/api/desk-pings" <<< "Authorization: Bearer $secret" || true
          }
          code=000
          if [ -n "$host" ]; then code=$(scan "$host"); echo "Function App: HTTP $code"; else echo "::notice::No Function App address for '$FUNC' in '$RG'; trying the site."; fi
          # The Function App's own address may refuse callers once the Static Web App is linked to it, or it wasn't
          # found: go through the site's /api instead (AZURE_SITE_HOST, else the Static Web App's, else its known address).
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then
            site="${SITE_HOST:-}"
            if [ -z "$site" ]; then site=$(az staticwebapp show -g "$RG" -n "$SWA" --query defaultHostname -o tsv 2>/dev/null) || site=""; fi
            site="${site:-thankful-forest-019308c1e.5.azurestaticapps.net}"
            code=$(scan "$site"); echo "Site: HTTP $code"
          fi
          echo "HTTP $code"
          # Counts only: { pinged, held, devices }.
          head -c 200 scan.json 2>/dev/null; echo
          # 503: pings aren't set up on Azure yet, which is fine.
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then echo "::error::The Desk's pings answered HTTP $code."; exit 1; fi
