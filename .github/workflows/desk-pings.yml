# The Desk's pings (#135): when a Foundry issue is opened or its labels change (a new idea, a question from Rivet,
# a blocker the Builder flags), ask the Desk's ping function on Vercel to look. It decides what needs Nikita's call,
# pings each phone that turned pings on once per item, and keeps quiet from 10pm to 7am Mountain
# (api/_desk/pings.ts). The hourly run catches anything the events missed and sends the 7am summary.
#
# The runs share one queue and each waits a minute first, so a burst (the three morning ideas, a card and its
# question) lands as one ping: a newer run replaces one still waiting. Nothing about an issue is sent; the function
# reads GitHub itself. The only secret is DESK_PINGS_SECRET (the same value as in Vercel), never printed.
#
# The Azure copy's Desk (docs/AZURE.md) has its own phones and its own pings secret, so a second job asks it too. It
# keeps no copy of that secret in GitHub: it signs in like deploy-azure.yml (OIDC, the `azure` environment, main
# only), reads `desk-pings-secret` from the Key Vault at run time (masked), and calls the Function App. Until Azure
# is set up, or while the secret can't be read, it skips quietly; a failure on Azure is a warning, never a red run.
name: Desk pings

on:
  issues:
    types: [opened, reopened, labeled, edited]
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: desk-pings
  cancel-in-progress: true

jobs:
  scan:
    # Only Foundry issues, only in this repo (not forks), and only once the secret is set.
    if: github.repository == 'nikitapage10/C.E.O.' && (github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'foundry'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DESK_PINGS_SECRET: ${{ secrets.DESK_PINGS_SECRET }}
    steps:
      - name: Wait for the burst to settle
        if: github.event_name == 'issues'
        run: sleep 60
      - name: Ask the Desk to look
        run: |
          if [ -z "$DESK_PINGS_SECRET" ]; then echo "DESK_PINGS_SECRET isn't set; pings are off."; exit 0; fi
          code=$(curl -sS -o scan.json -w '%{http_code}' -X POST --max-time 60 \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DESK_PINGS_SECRET" \
            --data '{"action":"scan"}' \
            https://command-everything-obviously.vercel.app/api/desk-pings)
          echo "HTTP $code"
          # Counts only: { pinged, held, devices }.
          head -c 200 scan.json; echo
          # 503: pings aren't set up on Vercel yet, which is fine.
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then exit 1; fi

  azure:
    if: github.repository == 'nikitapage10/C.E.O.' && vars.AZURE_CLIENT_ID != '' && (github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'foundry'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: azure
    permissions:
      id-token: write
    steps:
      - name: Wait for the burst to settle
        if: github.event_name == 'issues'
        run: sleep 60
      - name: Tidy the Azure settings
        id: az
        env:
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          SUB: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RG: ${{ vars.AZURE_RG }}
          FUNC: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          SWA: ${{ vars.AZURE_SWA_NAME }}
        # A pasted variable can carry a stray line break or space; drop them so sign-in sees clean IDs.
        run: |
          for k in CLIENT TENANT SUB RG FUNC SWA; do
            printf '%s=%s\n' "${k,,}" "$(printf '%s' "${!k}" | tr -d '\r\n[:space:]')" >> "$GITHUB_OUTPUT"
          done
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        id: login
        continue-on-error: true
        with:
          client-id: ${{ steps.az.outputs.client }}
          tenant-id: ${{ steps.az.outputs.tenant }}
          subscription-id: ${{ steps.az.outputs.sub }}
      - name: Ask the Azure Desk to look
        if: steps.login.outcome == 'success'
        env:
          RG: ${{ steps.az.outputs.rg }}
          FUNC: ${{ steps.az.outputs.func }}
          SWA: ${{ steps.az.outputs.swa }}
        run: |
          vault=$(az keyvault list -g "$RG" --query "[0].name" -o tsv 2>/dev/null) || vault=""
          secret=""
          if [ -n "$vault" ]; then secret=$(az keyvault secret show --vault-name "$vault" -n desk-pings-secret --query value -o tsv 2>/dev/null) || secret=""; fi
          if [ -z "$secret" ]; then echo "Can't read desk-pings-secret from the Azure Key Vault; Azure pings skipped."; exit 0; fi
          echo "::add-mask::$secret"
          host=$(az functionapp show -g "$RG" -n "$FUNC" --query defaultHostName -o tsv 2>/dev/null) || host=""
          if [ -z "$host" ]; then echo "::warning::Couldn't find the Azure Function App; skipped."; exit 0; fi
          scan() {
            curl -sS -o scan.json -w '%{http_code}' -X POST --max-time 60 \
              -H "Content-Type: application/json" -H @- --data '{"action":"scan"}' \
              "https://$1/api/desk-pings" <<< "Authorization: Bearer $secret" || true
          }
          code=$(scan "$host")
          # The Function App's own address may refuse callers once the Static Web App is linked to it; then go
          # through the site instead.
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            site=$(az staticwebapp show -g "$RG" -n "$SWA" --query defaultHostname -o tsv 2>/dev/null) || site=""
            if [ -n "$site" ]; then code=$(scan "$site"); fi
          fi
          echo "HTTP $code"
          # Counts only: { pinged, held, devices }.
          head -c 200 scan.json 2>/dev/null; echo
          # 503: pings aren't set up on Azure yet, which is fine.
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then echo "::warning::The Azure Desk's pings answered HTTP $code."; fi
      - name: Note a skipped sign-in
        if: steps.login.outcome != 'success'
        run: echo "::warning::Couldn't sign in to Azure; the Azure pings were skipped."
