# One-off probe for #1195 (removed before merge; never on main): leaf --help for the ordering commands, with a placeholder token (no account).
name: doordash-probe
on:
  push:
    branches: [chat/1195-doordash-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Leaf help
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir dl && cd dl
          gh release download -R doordash-oss/doordash-cli v0.2.6 --pattern 'dd-cli-v0.2.6-linux-amd64.tar.gz'
          mkdir x && tar -xzf *.tar.gz -C x
          bin="$PWD/x/dd-cli-v0.2.6-linux-amd64/dd-cli-v0.2.6-linux-amd64"
          H=$(mktemp -d /tmp/ddh.XXXX)
          run() { env -i PATH=/usr/bin:/bin HOME="$H" DD_CLI_ACCESS_TOKEN=placeholder-not-a-token "$bin" "$@"; }
          for c in "search" "menu" "restaurant-item-details" "store-details" "cart" "cart add-items" "cart show" "cart list" "cart remove-items" "cart update-items" "cart delete" "cart clear" "order" "order history" "order status" "order preview" "order submit" "order reorder" "order receipt" "promo" "promo list" "promo apply" "payment-method" "payment-method list" "address" "address list" "find-nearby-stores" "find-items" "item-details" "build-grocery-list" "find-item-across-retailers"; do
            echo "=================== $c"
            run $c --help 2>&1 | head -160
            echo "exit=${PIPESTATUS[0]}"
          done
