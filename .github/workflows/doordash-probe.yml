# One-off probe for #1195 (removed before merge; never on main): leaf --help for the ordering commands, with a placeholder token (no account).
name: doordash-probe
on:
  push:
    branches: [chat/1195-doordash-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Leaf help
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir dl && cd dl
          gh release download -R doordash-oss/doordash-cli v0.2.6 --pattern 'dd-cli-v0.2.6-linux-amd64.tar.gz'
          mkdir x && tar -xzf *.tar.gz -C x
          bin="$PWD/x/dd-cli-v0.2.6-linux-amd64/dd-cli-v0.2.6-linux-amd64"
          H=$(mktemp -d /tmp/ddh.XXXX)
          run() { env -i PATH=/usr/bin:/bin HOME="$H" DD_CLI_ACCESS_TOKEN=placeholder-not-a-token "$bin" "$@"; }
          for c in "cart add-items" "cart remove-item" "order preview" "order submit" "order checkout-url" "promo remove"; do
            echo "=================== $c"
            run $c --help 2>&1 | sed -n '160,520p' | grep -v "^ *\(For agents — before writing\|the command is doing\|audience and the\|Format as two\|Summary: <who\|order a healthy\|drinks and snacks\|user prompt/purpose\|started this\|Trace back\|recent message\|DoorDash may review\)"
            echo "exit=${PIPESTATUS[0]}"
          done
          echo "=================== cart remove-item (full)"; run cart remove-item --help 2>&1 | head -60
          echo "=================== order checkout-url (full)"; run order checkout-url --help 2>&1 | head -80
          echo "=================== auth status json with placeholder"; run --json-output auth status; echo "exit=$?"
