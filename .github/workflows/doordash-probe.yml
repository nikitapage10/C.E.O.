# One-off probe for #1195 (removed before merge; never on main): reads the DoorDash CLI's latest release and its help.
name: doordash-probe
on:
  push:
    branches: [chat/1195-doordash-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view -R doordash-oss/doordash-cli --json tagName,publishedAt,body,assets --jq '.tagName, .publishedAt, .body, (.assets[] | "\(.name) \(.size) \(.digest // "")")'
          mkdir dl && cd dl
          gh release download -R doordash-oss/doordash-cli --pattern '*linux-amd64*'
          ls -la
          sha256sum *
          mkdir x && tar -xzf *linux-amd64.tar.gz -C x && find x -maxdepth 3 -exec ls -ld {} \;
          d=$(ls -d x/dd-cli-*); bin="$d/$(basename $d)"; file "$bin"
          cat "$d/skills/dd-cli-usage/"* || true
          ls "$d/skills/dd-cli-usage/"
          du -sh "$d"
          "$bin" --help || true
          "$bin" --help 2>/dev/null | awk '/^ {2,}[a-z]/{print $1}' | sort -u > cmds.txt; cat cmds.txt
          for c in $(cat cmds.txt); do echo "=== $c"; "$bin" $c --help 2>&1 | head -80 || true; done
          "$bin" login --help 2>&1 | head -60 || true
