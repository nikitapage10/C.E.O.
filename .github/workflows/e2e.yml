# The browser tests (tests/e2e): the Lattice in headless Chromium on SwiftShader. They are slow and have never run
# on GitHub's runners before, so for now they run nightly on main, on demand, and on a pull request labelled "e2e".
# Once the nightly run has been green for two weeks they run on every pull request and "e2e" joins the required
# checks (docs/DELIVERY.md, "CI gates"). They live apart from checks.yml so the Desk's checks light, which reads
# checks.yml, only turns red for the checks that gate main today; the nightly run has its own light on Systems, and a
# red run on main opens a "Nightly browser tests failing on main" Foundry fix issue.
# The suites run side by side (Desk and Lattice); a pull request that only touches the Desk, the APIs or the docs
# skips the slow Lattice suite. The `e2e` job is the one result for both.
name: E2E

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    # Two suites side by side: the Desk's pages, and the Lattice (the slow one, a 3D world on a software renderer).
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [desk, lattice]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Does this change reach the Lattice?
        # On a pull request the Lattice suite runs only when the change touches something the 3D world uses: anything
        # outside the Desk's own code, the APIs and the docs. Nightly and on-demand runs always run both suites.
        id: scope
        env:
          SUITE: ${{ matrix.suite }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          run=true
          if [ "$SUITE" = lattice ] && [ "$EVENT" = pull_request ]; then
            if ! git diff --name-only "$BASE"...HEAD | grep -vqE '^(apps/world/src/desk/|api/|docs/|lore/|tests/e2e/(headers|skippy|undo|flow)\.spec\.ts$|.*\.md$)'; then
              run=false
              echo "Nothing the Lattice uses changed; skipping its suite."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
      - name: Install Chromium
        if: steps.scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        if: steps.scope.outputs.run == 'true'
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = lattice ]; then npm run test:e2e -- tests/e2e/lattice.spec.ts
          else npm run test:e2e -- tests/e2e/headers.spec.ts tests/e2e/skippy.spec.ts tests/e2e/undo.spec.ts tests/e2e/flow.spec.ts; fi
      - name: Keep what the failing tests saw
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.suite }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    # One result for both suites, under the name the rulesets and docs use.
    needs: browser
    if: always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both suites passed
        env:
          RESULT: ${{ needs.browser.result }}
        run: |
          echo "Browser suites: $RESULT"
          [ "$RESULT" = success ]

  report:
    # The only job that may write: it opens (or comments on) the "Nightly browser tests failing on main" fix issue.
    needs: e2e
    if: failure() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      # The crew's own identity (#138): with the App's secrets set, the issue comes from ceo-foundry[bot] on a token
      # that can only write this repo's issues and lapses within the hour. Without them, or if GitHub won't mint one,
      # the built-in token writes it, as before. Only whether they are set is read here, never their values.
      HAS_APP: ${{ secrets.FOUNDRY_APP_ID != '' && secrets.FOUNDRY_APP_PRIVATE_KEY != '' }}
    steps:
      - name: The crew's token
        id: app
        if: env.HAS_APP == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.FOUNDRY_APP_ID }}
          private-key: ${{ secrets.FOUNDRY_APP_PRIVATE_KEY }}
          permission-issues: write
      - name: Open a Foundry fix
        id: issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
          script: |
            const title = "Nightly browser tests failing on main";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "foundry,foundry:fix", per_page: 50 });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Still failing (nightly browser tests): ${run} (commit ${context.sha.slice(0, 7)}).` });
              core.setOutput("number", String(existing.number));
              core.setOutput("fresh", "false");
            } else {
              const { data: created } = await github.rest.issues.create({
                ...context.repo,
                title,
                labels: ["foundry", "foundry:fix"],
                body: `The nightly browser tests failed on main at commit ${context.sha.slice(0, 7)}.\n\nRun: ${run}\n\nThe Foundry picks this up; see docs/FOUNDRY.md.`,
              });
              core.setOutput("number", String(created.number));
              core.setOutput("fresh", "true");
            }
