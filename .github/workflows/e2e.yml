# The browser tests (tests/e2e): the Lattice in headless Chromium on SwiftShader. They are slow and have never run
# on GitHub's runners before, so for now they run nightly on main, on demand, and on a pull request labelled "e2e".
# Once the nightly run has been green for two weeks they run on every pull request and "e2e" joins the required
# checks (docs/DELIVERY.md, "CI gates"). They live apart from checks.yml so the Desk's checks light, which reads
# checks.yml, only turns red for the checks that gate main today.
name: E2E

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Keep what the failing tests saw
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
