# Visual QA (#91): after every push to main, record a short clip of each Lattice room from the built site
# (scripts/room-tour.mjs) and have Gemini watch them for visual bugs, like barrels blocking Rusty's dock
# (scripts/visual-qa.mjs). Blockers open (or comment on) one "Visual QA: <room>: …" foundry:fix issue per room, so the
# Foundry's fix lane picks them up. The Desk shows the latest run on Systems > Foundry (api/visual-qa-feed.ts).
#
# This never gates main: it lives apart from checks.yml, and Gemini being down, out of quota or unset (no
# GEMINI_API_KEY secret) only shows in the summary. Spend is capped per run in code ($0.50) and per day (8 pushed runs).
# See docs/THREAT-MODEL.md (TB8) and docs/SECURITY.md (the secret).
name: Visual QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit on main matters: a newer push cancels a tour still running.
concurrency:
  group: visual-qa
  cancel-in-progress: true

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # to count today's runs for the daily cap
    outputs:
      issues: ${{ steps.review.outputs.issues }}
      tour_failed: ${{ steps.tour_failed.outputs.failed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: ffmpeg, to cut the clips
        run: command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - name: Build
        run: npm run build
      - name: Record the room tour
        id: tour
        # Held open so a tour that can't start or boot is reported (the report job opens a fix issue) before this run
        # fails, at "Fail the run if the tour failed" below. Only this step's outcome counts, never Gemini's.
        continue-on-error: true
        run: node scripts/room-tour.mjs
      - name: The tour failed
        id: tour_failed
        if: steps.tour.outcome == 'failure'
        run: echo "failed=true" >> "$GITHUB_OUTPUT"
      - name: Count today's runs
        id: today
        if: steps.tour.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/visual-qa.yml/runs?branch=main&created=%3E%3D$(date -u +%F)&per_page=1" --jq .total_count || echo 0)
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - name: Gemini review
        id: review
        if: steps.tour.outcome == 'success'
        # Gemini can't fail this run: the script exits 0 on its own errors, and this catches anything else.
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VISUAL_QA_RUNS_TODAY: ${{ steps.today.outputs.count }}
        run: node scripts/visual-qa.mjs
      - name: Keep the headline for the Desk
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # The Desk's feed reads the run's headline from this artifact's name (api/_visualqa/review.ts, summaryName).
          name: ${{ steps.review.outputs.summary || 'visual-qa-summary-v1-unavailable-r0-f0-b0' }}
          path: test-results/visual-qa/findings.json
          if-no-files-found: warn
          retention-days: 30
      - name: Keep the clips and findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-qa-clips
          path: |
            test-results/visual-qa/*.webm
            test-results/visual-qa/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail the run if the tour failed
        if: steps.tour.outcome == 'failure'
        run: |
          echo "::error::The room tour failed to start or boot (scripts/room-tour.mjs)."
          exit 1

  report:
    # The only job that may write: it opens (or comments on) one fix issue per room with a blocker, and one when the
    # room tour itself couldn't start or boot.
    needs: tour
    if: always() && github.ref == 'refs/heads/main' && ((needs.tour.outputs.issues != '' && needs.tour.outputs.issues != '[]') || needs.tour.outputs.tour_failed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      # The crew's own identity (#138), as in checks.yml: the App's issues-only, hour-long token when its secrets are
      # set and GitHub mints one, else the built-in token. Only whether they are set is read here.
      HAS_APP: ${{ secrets.FOUNDRY_APP_ID != '' && secrets.FOUNDRY_APP_PRIVATE_KEY != '' }}
    steps:
      - name: The crew's token
        id: app
        if: env.HAS_APP == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.FOUNDRY_APP_ID }}
          private-key: ${{ secrets.FOUNDRY_APP_PRIVATE_KEY }}
          permission-issues: write
      - name: Open or update the Foundry fixes
        if: needs.tour.outputs.issues != '' && needs.tour.outputs.issues != '[]'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          # Passed as data, never pasted into the script: the text started as model output.
          ISSUES: ${{ needs.tour.outputs.issues }}
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
          script: |
            const planned = JSON.parse(process.env.ISSUES || "[]");
            if (!Array.isArray(planned)) return;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "foundry,foundry:fix", per_page: 100 });
            for (const p of planned.slice(0, 3)) {
              if (typeof p?.prefix !== "string" || !p.prefix.startsWith("Visual QA: ") || typeof p.title !== "string" || !p.title.startsWith(p.prefix)) continue;
              // One open issue per room: matched on "Visual QA: <room>:", since the wording changes run to run.
              const existing = open.find((i) => i.title.startsWith(p.prefix));
              if (existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: String(p.comment).slice(0, 4000) });
                core.info(`Commented on #${existing.number}`);
              } else {
                const { data: made } = await github.rest.issues.create({ ...context.repo, title: p.title.slice(0, 120), body: String(p.body).slice(0, 6000), labels: ["foundry", "foundry:fix"] });
                core.info(`Opened #${made.number}`);
              }
            }
      - name: Open a fix when the tour couldn't start
        # Not Gemini: only the tour step failing lands here. No model output is involved, the text is fixed.
        if: needs.tour.outputs.tour_failed == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
          script: |
            const prefix = "Visual QA: the room tour couldn't start";
            const sha = context.sha.slice(0, 7);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "foundry,foundry:fix", per_page: 100 });
            // One open issue for it, whatever the commit: matched on the prefix.
            const existing = open.find((i) => i.title.startsWith(prefix));
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Still failing: ${run} (commit ${sha}).` });
              core.info(`Commented on #${existing.number}`);
            } else {
              const { data: made } = await github.rest.issues.create({
                ...context.repo,
                title: `${prefix} on ${sha}`,
                labels: ["foundry", "foundry:fix"],
                body: [
                  `**Pitch:** Visual QA records a clip of each Lattice room after every push to main, and today's run couldn't: the room tour (\`node scripts/room-tour.mjs\`) failed to start or boot at commit ${sha}, so no room was checked.`,
                  `**Size:** small`,
                  `**Short:** Fixing the room tour`,
                  `**Builder:** Rusty (Sonnet), the fix lane`,
                  ``,
                  `Run: ${run}`,
                  ``,
                  `Open the "Record the room tour" step's log for the error. It is usually the built site not booting (the boot check in checks.yml should have caught that on the pull request), a missing browser or ffmpeg, or the Lattice taking longer than the tour waits. See docs/FOUNDRY.md ("Visual QA").`,
                ].join("\n"),
              });
              core.info(`Opened #${made.number}`);
            }
