<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow kit harness</title>
    <style>html,body{margin:0;background:#0b0c10}</style>
  </head>
  <body>
    <!-- Dev server only (tests/e2e/flow.spec.ts, #428): the build never includes it. -->
    <!-- It sits in @ceo/desk, outside @ceo/world's Vite root, so the dev server sends it by its file path (/@fs/…) as
         it is, without the transform that adds React refresh's preamble; it adds the preamble itself, the way Vite's
         "Backend Integration" guide does (#617). -->
    <script type="module">
      import RefreshRuntime from "/@react-refresh";
      RefreshRuntime.injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <div id="root"></div>
    <script type="module" src="./harness.tsx"></script>
  </body>
</html>
