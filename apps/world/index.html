<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04060b" />
    <title>C.E.O. — Command Everything, Obviously</title>
    <!-- The Desk as a home-screen app (#135): manifest.webmanifest, the icons, and the service worker in public/sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/desk/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="C.E.O." />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="icon" href="/desk/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/desk/favicon-32.png" type="image/png" sizes="32x32" />
    <style>
      /* The first paint, before the app boots: the Lattice's void, so nothing flashes the wrong colour. */
      html,
      body {
        margin: 0;
        background: #04060b;
        color: #e8f1ff;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 300 28px Georgia, "Times New Roman", serif;
        letter-spacing: 0.42em;
        color: #8a93a6;
      }
    </style>
  </head>
  <body>
    <!-- Shown until the app boots; the React loading screen takes over seamlessly. -->
    <div id="root">
      <div class="boot">C.E.O.</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
